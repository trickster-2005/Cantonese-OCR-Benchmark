    樣本瀏覽器需要 JavaScript。完整資料集請見 HuggingFace。

  # ---- 05 評測結果 ----
  results_h2: |
    評測結果
  results_lead: |
    模型在粵語字上的表現。
  results_intro: |
    兩個同為 4B 參數的視覺語言模型，在 NVIDIA L40S 上以相同 prompt
    與解碼參數跑完整 4,930 張。指標採 OCR 慣例：CER（字元錯誤率，越低越好）、
    ACC（整句完全正確率）、1−NED（正規化編輯相似度）。
  results_th_model: |
    模型
  results_th_acc_char: |
    單字層 ACC
  results_th_acc_sentence: |
    短句層 ACC
  results_th_acc_ext: |
    擴展區字 ACC
  results_eval_note: |
    完整 4,930 張影像 × 2 個模型，共 9,860 筆，全數成功執行，無失敗樣本。
  results_observation_heading: |
    觀察
  results_observation_text: |
    兩個模型在擴展區字（168 張樣本）上正確率都是 0%，字形完全認不出來。
    粵語常用字也有類似分化：<code>冇</code> 單字層兩個模型都是 0/7 全錯，
    句子層依然接近 0%（InternVL3.5 0/99、Qwen3-VL 7/99），上下文救不回來，
    是純粹的視覺辨識失敗。但 <code>嘅</code> 同樣單字層 0/7，句子層卻回升到
    三成多（InternVL3.5），代表模型雖然認不出這個字的形狀，卻能靠語言記憶
    把常見虛詞「猜」回來。同一種視覺缺陷會不會被語言先驗補償，因字而異。

  # ---- 06 未來展望 ----
  next_h2: |
    未來展望
  next_lead: |
    合成資料只是起點。
  next_li1: |
    <strong>真實影像評測集。</strong>合成資料無法取代真實場景。下一步是蒐集香港街景招牌、餐牌、報紙，人工校對成一個小型真實評測集。
  next_li2: |
    <strong>訓練集與微調驗證。</strong>把規模拉大到足以微調，然後實測「用了合成資料的模型，在真實粵語影像上有沒有變好」。沒有這一步，合成資料集的價值就只停留在推測。
  next_li3: |
    <strong>直排與手寫。</strong>香港招牌大量使用直排，目前只有橫排。手寫則卡在粵語手寫字型幾乎不存在。

