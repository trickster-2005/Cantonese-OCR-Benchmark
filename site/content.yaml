  core_design_note: |
    <strong>The core design:</strong> the same character appears in both the
    character tier and the sentence tier. If a model reads <code>冇</code>
    correctly in isolation but returns <code>有</code> inside a sentence, the
    failure is not visual. It is the
    <strong>language-model prior overriding the glyph actually on screen</strong>.
    A sentence-only benchmark cannot separate those two cases.

  pairs_heading: |
    Minimal pairs
  pairs_intro: |
    The dataset deliberately includes the matching Standard Chinese characters
    (有, 既, 左, 但 and so on) as a baseline. Without that baseline there is no way
    to tell whether reading <code>冇</code> as <code>有</code> is a visual problem
    or a linguistic one. Some of the pairs the design targets:

  pair1_why: |
    Two strokes apart, opposite meaning
  pair2_why: |
    Most common confusion
  pair3_why: |
    Left radical easily dropped
  pair4_why: |
    Nearly identical shape
  pair5_why: |
    Extra mouth radical
  pair6_why: |
    Semantic swap, not visual

