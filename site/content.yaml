  pairs_intro: |
    資料集刻意收錄成對的書面語對照字（有、既、左、但等）作為基準線。
    沒有基準線就無法判斷模型把 <code>冇</code> 讀成 <code>有</code>
    究竟是視覺問題還是語言習慣問題。以下是設計時鎖定的部分字對：

