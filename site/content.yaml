en:
  meta_title: |
    [Draft] Cantonese OCR Benchmark | OCF 2026
  meta_description: |
    An image benchmark for Cantonese OCR. 4,930 synthetic text-line images covering Cantonese-specific characters, words and sentences.

  sidebar_title: |
    Cantonese OCR Benchmark
  sidebar_subtitle: |
    粵語 OCR 評測資料集 · Yu-Tang Yu

  nav_why: |
    Motivation
  nav_how: |
    Method
  nav_dataset: |
    Dataset
  nav_samples: |
    Samples
  nav_results: |
    Results
  nav_next: |
    Outlook

  hero_h1: |
    A Cantonese OCR benchmark
  hero_sub: |
    Mainstream OCR cannot read the characters used in written Cantonese, and the
    Cantonese datasets that exist are all text or audio. This project builds an
    image-based Cantonese OCR benchmark and opens the pipeline that generates it.
  hero_badge_size: |
    4,930 images

  # ---- 01 Motivation ----
  why_h2: |
    Motivation
  why_lead: |
    Written Cantonese uses characters mainstream OCR never learned.
  why_gap_heading: |
    Gaps in existing resources
  why_gap_intro: |
    Everyday writing in Hong Kong is full of characters that do not exist in
    Standard Written Chinese, for example
    <span class="cjk-big">嘅, 咗, 冇, 喺, 𨋢</span>.
    These characters barely appear in mainstream OCR training data, and models
    struggle with them. Surveying what already exists turned up three gaps:
  why_gap_li1: |
    <strong>No image dataset.</strong>
    There are twenty-odd Cantonese datasets on HuggingFace, all of them text or
    audio. We did not find one that provides Cantonese OCR data as images.
  why_gap_li2: |
    <strong>Existing benchmarks measure language understanding.</strong>
    Recent Cantonese benchmarks (CantoNLU, HKCanto-Eval) evaluate comprehension
    and cultural knowledge. We did not find a public benchmark for visual
    recognition.
  why_gap_li3: |
    <strong>Some Cantonese characters are missing from fonts entirely.</strong>
    Across the 33 open-licensed font instances we checked,
    <code>𠮶</code> (U+20BB6) is supported by none. A character no font carries
    is one a model never had a chance to learn.
  why_common_chars: |
    The harder problem is not the rare characters, but the ones that look like
    common ones. <code>冇</code> (“to not have”) differs from <code>有</code>
    (“to have”) by two strokes and means the opposite. Misread one character and
    the sentence inverts.
  why_contrib_heading: |
    What this project contributes
  why_contrib_li1: |
    <strong>A reproducible Cantonese OCR benchmark.</strong>
    Three tiers (character, word, sentence) covering 154 Cantonese-specific
    characters, with a fixed random seed so the same corpus produces
    bit-identical output.
  why_contrib_li2: |
    <strong>A design that separates two kinds of failure.</strong>
    The same character appears in both the character tier and the sentence tier,
    which distinguishes “could not see it” from “knew the shape but was
    overridden by language habit”.
  why_contrib_li3: |
    <strong>An openly licensed generation pipeline.</strong>
    Every corpus and font has an explicit licence, so the resulting dataset can
    be distributed publicly.
  why_contrib_li4: |
    <strong>Baseline scores for two vision-language models</strong>
    as a starting point for later comparison.

  # ---- 02 Method ----
  how_h2: |
    Method
  how_lead: |
    Three corpora, synthetic rendering, fully reproducible.
  how_li1: |
    <strong>Corpora</strong>: Cantonese Wikipedia, the Hong Kong Cantonese Corpus (HKCanCor), and the rime-cantonese lexicon. All three are cleanly licensed.
  how_li2: |
    <strong>Character set</strong>: derived by subtracting the mainland, Taiwan and Hong Kong standard character lists from corpus character frequencies, then reviewed by hand.
  how_li3: |
    <strong>Fonts</strong>: SIL OFL only (Chiron Hei HK, Chiron Sung HK, Noto CJK, Hong Kong Character Set), 33 instances in total.
  how_li4: |
    <strong>Augmentation</strong>: rotation, perspective, elastic distortion, stroke weight, blur, noise and JPEG artefacts, across four difficulty levels.
  how_li5: |
    <strong>Quality gates</strong>: the font is checked for the glyph before rendering and legibility is checked after, which avoids the classic failure where a blank box is rendered while the label still claims a character.
  how_li6: |
    <strong>Reproducible</strong>: a fixed seed means the same corpus snapshot produces bit-identical output.
  how_more: |
    Full methodology, parameters and validation data are in the
    <a href="{{shared.urls.gh}}">GitHub README</a> and the
    <a href="{{shared.urls.hf}}">HuggingFace dataset card</a>.

