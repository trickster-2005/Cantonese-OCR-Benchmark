  # 最上面的大標題區塊
  hero_h1: |
    粵語 OCR 評測資料集
  hero_sub: |
    粵語書寫用的字，主流 OCR 認不得；而現有的粵語資料集，全是文字與語音。
    本專案製作一份影像形式的粵語 OCR 評測資料集，並公開整套生成管線。
  hero_badge_size: |
    4,930 張

  # ---- 01 動機與目標 ----
  why_h2: |
    動機與目標
  why_lead: |
    粵語書寫用的字，主流 OCR 沒學過。
  why_gap_heading: |
    現有資源的不足
  why_gap_intro: |
    香港的日常書寫大量使用標準中文沒有的字，例如
    <span class="cjk-big">嘅、咗、冇、喺、𨋢</span>。
    這些字在主流 OCR 的訓練資料中極少出現，模型辨識起來相當吃力。
    我們在盤點現有資源時發現三件事：
  why_gap_li1: |
    <strong>影像資料集付之闕如。</strong>
    HuggingFace 上搜得到的粵語資料集有二十多個，內容都是純文字或語音，
    目前未找到以影像形式提供的粵語 OCR 資料集。
  why_gap_li2: |
    <strong>既有評測都在測文字理解。</strong>
    近年的粵語基準測試（如 CantoNLU、HKCanto-Eval）評估的是語言理解與文化知識，
    視覺辨識這一塊尚未見到公開的評測基準。
  why_gap_li3: |
    <strong>部分粵語字連字型都缺。</strong>
    我們檢查了 33 個開源字型實例，<code>𠮶</code>（U+20BB6）的支援數是 0。
    字型都沒收錄的字，模型自然沒有機會學會。
  why_common_chars: |
    真正棘手的其實不是罕見字，而是那些「長得很像常用字」的。
    <code>冇</code>（沒有）和 <code>有</code> 只差兩筆，語義卻完全相反。
    辨錯一個字，整句話的意思就顛倒了。
  why_contrib_heading: |
    本專案的貢獻
  why_contrib_li1: |
    <strong>一份可重現的粵語 OCR 評測集。</strong>
    三層結構（單字、詞彙、短句），涵蓋 154 個粵語特有字，固定亂數種子，
    同一份語料可產出逐位元相同的結果。
  why_contrib_li2: |
    <strong>能區分兩種失敗原因的實驗設計。</strong>
    同一個字同時出現在單字層與句子層，可以分辨模型是「看不清楚」
    還是「知道形狀但被語言習慣蓋過去」。
  why_contrib_li3: |
    <strong>授權乾淨的開源生成管線。</strong>
    語料與字型全部採用明確授權的來源，產出的資料集可以公開散布。
  why_contrib_li4: |
    <strong>兩個視覺語言模型的基線分數。</strong>
    提供後續研究比較的起點。

  # ---- 02 製作方式 ----
  how_h2: |
    製作方式
  how_lead: |
    三份語料，合成渲染，全程可重現。
  how_li1: |
    <strong>語料</strong>：粵語維基百科、香港粵語語料庫（HKCanCor）、rime-cantonese 詞庫。三者授權都乾淨。
  how_li2: |
    <strong>字表</strong>：從語料字頻扣掉兩岸及香港的標準字表推導出粵語特有字，再經人工複核。
  how_li3: |
    <strong>字型</strong>：只用 SIL OFL 授權字型（昭源黑體、昭源宋體、Noto CJK、香港民間字集），共 33 個實例。
  how_li4: |
    <strong>增強</strong>：旋轉、透視、彈性形變、筆畫粗細、模糊、雜訊、JPEG 壓縮痕跡，分四個難度等級。
  how_li5: |
    <strong>品質防線</strong>：渲染前檢查字型是否真的收錄該字形，渲染後檢查可讀性，避免產出「空白方框但標註寫著某字」這種汙染標註的樣本。
  how_li6: |
    <strong>可重現</strong>：固定亂數種子，同一份語料產出逐位元相同的結果。
  how_more: |
    完整方法論、參數與驗證數據寫在
    <a href="{{shared.urls.gh}}">GitHub README</a> 與
    <a href="{{shared.urls.hf}}">HuggingFace dataset card</a>。

  # ---- 03 資料集內容 ----
  dataset_h2: |
    資料集內容
  dataset_lead: |
    三層結構，同一個字跨層出現。

