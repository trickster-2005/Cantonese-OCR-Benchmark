  # ---- 05 Results ----
  results_h2: |
    Results
  results_lead: |
    How the models do on Cantonese characters.
  results_intro: |
    Two 4B-parameter vision-language models, run over all 4,930 images on an
    NVIDIA L40S with identical prompts and decoding parameters. Metrics follow OCR
    convention: CER (character error rate, lower is better), ACC (exact sequence
    match), 1−NED (normalised edit similarity).
  results_th_model: |
    Model
  results_th_acc_char: |
    ACC char
  results_th_acc_sentence: |
    ACC sentence
  results_th_acc_ext: |
    ACC ext. blocks
  results_eval_note: |
    All 4,930 images × 2 models, 9,860 runs total, completed with zero failures.
  results_observation_heading: |
    Observations
  results_observation_text: |
    Both models score 0% on the 168 extension-block samples — they cannot read
    the glyph shapes at all. Common Cantonese characters split into two
    patterns. <code>冇</code> scores 0/7 at the character tier for both models
    and stays near zero in sentences too (InternVL3.5 0/99, Qwen3-VL 7/99):
    context does not rescue it, a pure visual failure. <code>嘅</code> also
    scores 0/7 in isolation, but recovers to roughly a third correct in
    sentences (InternVL3.5) — the model cannot read the shape, yet can guess a
    common function word from language memory. Whether the language prior
    compensates for a visual gap turns out to depend on the character.

  # ---- 06 Outlook ----
  next_h2: |
    Outlook
  next_lead: |
    Synthetic data is only the starting point.
  next_li1: |
    <strong>A real-image evaluation set.</strong> Synthetic data cannot stand in for real scenes. The next step is collecting Hong Kong shop signs, menus and newspapers and proofreading them into a small real benchmark.
  next_li2: |
    <strong>Training set and fine-tuning evidence.</strong> Scale up enough to fine-tune, then measure whether a model trained on this data actually improves on real Cantonese images. Without that step, the value of a synthetic dataset remains a claim.
  next_li3: |
    <strong>Vertical text and handwriting.</strong> Hong Kong signage is often vertical; this release is horizontal only. Handwriting is blocked on the near-total absence of Cantonese handwriting fonts.

