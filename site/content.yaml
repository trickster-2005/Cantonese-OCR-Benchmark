  # ---- 04 資料集預覽 ----
  samples_h2: |
    資料集預覽
  samples_lead: |
    資料實際長什麼樣。
  samples_intro: |
    紅色標示的是粵語特有字。可依層級、難度篩選，或只看擴展區（Unicode Extension）
    字元與最小對立對（minimal pair）。
