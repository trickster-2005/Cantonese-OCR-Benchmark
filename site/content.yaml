  core_design_note: |
    <strong>核心設計：</strong>同一個字會同時出現在「單字」和「句子」兩層。
    如果模型在單字層把 <code>冇</code> 認對、在句子層卻讀成 <code>有</code>，
    那就不是視覺問題，而是<strong>語言模型的先驗蓋過了實際看到的字形</strong>。
    只測句子的評測分不出這兩種情況。

  pairs_heading: |
