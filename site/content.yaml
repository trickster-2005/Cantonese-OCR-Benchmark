# ============================================================================
# 網站文字內容 —— 改這個檔案就能改網站上的文字
# ============================================================================
#
# 用法：
#   1. 改下面的文字（保持縮排一致就好，不用管 YAML 語法細節）
#   2. 執行 python site/build_site.py
#   3. docs/index.html 和 docs/en/index.html 會自動重新產生
#   4. 用瀏覽器打開 docs/index.html 看結果，滿意後照平常方式 git commit + push
#
# 規則：
#   - 每個項目都用「key: |」加下一行縮排文字的格式，不管長短都這樣寫，
#     這樣文字裡出現冒號、引號都不會弄壞格式。
#   - 縮排一定要對齊（跟第一行的縮排一樣），這是 YAML 的規定。
#   - 文字裡可以放這些 HTML 標籤：<strong>粗體</strong>、<code>代碼</code>、
#     <a href="...">連結</a>、<br> 換行。其他標籤不要亂加。
#   - 不要動 {{ }} 這種花括號記號 —— 那是版面模板用的，不是文字內容。
#   - zh: 區塊是中文版、en: 區塊是英文版、shared: 區塊是兩版都一樣的東西
#     （網址、CC BY-SA 4.0 這種不用翻譯的字串）。改 shared 會同時影響兩版。
#   - 三層縮排結構是 section（章節）> 底下的欄位，照著現有的位置改就好，
#     不要新增或刪除 key，只改冒號後面的文字內容。
#
# 想要調整「版面」（顏色、字體大小、卡片排列方式）要改 docs/assets/style.css，
# 這個檔案只管文字。想要調整「章節順序」要改 site/template.html。
# ============================================================================

